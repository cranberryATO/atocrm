[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "André Tousch", email = "62934049+cranberryATO@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlmodel>=0.0.48",
]

[project.scripts]
app = "app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

# [tool.pytest.ini_options]
# addopts = "--cov=app --cov-branch --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/test/*", "conftest.py"]

[tool.coverage.report]
fail_under = 50
